#
# 商户分类规则 — 按文件顺序匹配，第一条命中即生效。
# 具体规则放上面，通用规则放下面。
#
# 字段:
#   name      必填，规则名，会写进 review.csv 便于核对
#   action    必填 EXPENSE / INCOME / TRANSFER / FUNDING / IGNORE
#   category  仅 EXPENSE 需要，填 categories.toml 里的小类 id
#   desc      正则，匹配交易描述
#   type_is   精确匹配机构自己的类型码（如 Chase 的 LOAN_PMT）
#   source_is 只对某个 parser 生效（如 chase_checking）
#   amount_min / amount_max  按金额绝对值过滤
#   note      备注，会写进 review.csv
#
# 新增规则后重跑 run.py 即可，无需改代码。
#

# ============================================================
# 一、结构性规则 — 排除转账/充值，防止重复计账
#    这些优先级最高，必须在商户规则之前
# ============================================================

[[rule]]
name = "chase-card-payment"
type_is = "LOAN_PMT"
action = "TRANSFER"
note = "信用卡还款，真实开支在信用卡账单里，此处不能计"

[[rule]]
name = "card-payment-generic"
desc = '(?i)(payment to .*card ending|^(online |automatic )?payment.*thank ?you)'
action = "TRANSFER"
note = "信用卡还款"

[[rule]]
name = "zelle-self-transfer"
desc = '(?i)zelle payment (from|to) YANZHAO XU'
action = "TRANSFER"
note = "本人账户间 Zelle 转账"

[[rule]]
name = "chase-partner-transfer"
type_is = "PARTNERFI_TO_CHASE"
action = "TRANSFER"
note = "外部银行转入 Chase"

[[rule]]
name = "paypal-funding"
desc = '(?i)PAYPAL\s+(INST XFER|TRANSFER|ECHECK)'
action = "FUNDING"
funding_target = "paypal"
note = "PayPal 充值，真实开支在 PayPal 账单里；若未导入 PayPal CSV 这部分会漏计"

[[rule]]
name = "venmo-funding"
desc = '(?i)^VENMO\s+(CASHOUT|PAYMENT|TRANSFER)'
action = "FUNDING"
funding_target = "venmo"
note = "Venmo 充值/提现，真实开支在 Venmo 账单里"

[[rule]]
name = "paypal-bank-deposit"
desc = '(?i)bank deposit to pp account'
action = "TRANSFER"
note = "checking 里 PAYPAL INST XFER 的对侧，同一笔钱，两边都不能计"

[[rule]]
name = "internal-transfer-generic"
desc = '(?i)(transfer (to|from) (savings|checking)|online transfer)'
action = "TRANSFER"
note = "账户间转账"

[[rule]]
name = "bank-interest"
desc = '(?i)(^interest payment|interest earned)'
action = "INCOME"
note = "存款利息"

[[rule]]
name = "investment-transfer"
desc = '(?i)(betterment|stash capital|wealthfront|vanguard|fidelity|schwab).*(des:|transfer|ach)'
action = "TRANSFER"
note = "转入投资账户，钱没花掉；净值变化由资产模块反映"

[[rule]]
name = "unemployment-benefit"
desc = '(?i)california edd'
action = "INCOME"
note = "加州失业金"

[[rule]]
name = "coaching-income"
desc = '(?i)elitecoach'
action = "INCOME"
note = "教练收入"

[[rule]]
name = "payroll"
desc = '(?i)(direct dep|payroll|dir dep)'
action = "INCOME"
note = "工资"

# ============================================================
# 二、水电煤 / 通讯  → 68 住/水电煤物业
# ============================================================

[[rule]]
name = "home-mortgage"
desc = '(?i)(wf home mtg|home mtg|mortgage.*auto pay)'
action = "EXPENSE"
category = 84
note = "房贷自动扣款"

[[rule]]
name = "utility-pge"
desc = '(?i)(^PGANDE|PG&E|PACIFIC GAS)'
action = "EXPENSE"
category = 68
note = "PG&E 电气"

[[rule]]
name = "utility-water-garbage"
desc = '(?i)(water dist|water util|EBMUD|recology|waste manage|garbage|san jose utilities|csj smart meters)'
action = "EXPENSE"
category = 68

[[rule]]
name = "utility-internet-phone"
desc = '(?i)(comcast|xfinity|at&?t|verizon|t-?mobile|sprint|astound|sonic\.net)'
action = "EXPENSE"
category = 68
note = "宽带/手机"

# ============================================================
# 三、饮食  → 67 食/饮食
# ============================================================

[[rule]]
name = "grocery"
desc = '(?i)(safeway|trader joe|whole ?foods|sprouts|99 ?ranch|h ?mart|marina food|lucky sup|food ?maxx|grocery outlet|smart ?& ?final)'
action = "EXPENSE"
category = 67
note = "超市"

[[rule]]
name = "restaurant-delivery"
desc = '(?i)(doordash|uber ?eats|grubhub|postmates|caviar|seamless|instacart)'
action = "EXPENSE"
category = 67
note = "外卖"

[[rule]]
name = "coffee-fastfood"
desc = '(?i)(starbucks|peets|philz|chipotle|panera|subway|mcdonald|in-?n-?out|five guys|shake shack|boiling point|kura|panda express)'
action = "EXPENSE"
category = 67

[[rule]]
name = "local-restaurants"
desc = '(?i)(feng hotpot|noodle talk|cheung hing|chuan hai|mala mala|taiwan porridge|paris baguette|evergreen)'
action = "EXPENSE"
category = 67
note = "本地餐馆"

[[rule]]
name = "asian-grocery"
desc = '(?i)(t&amp;t supermarket|t&t supermarket|99 ranch|h mart|marina food|ranch 99)'
action = "EXPENSE"
category = 67
note = "亚洲超市"

[[rule]]
name = "costco-warehouse-run"
desc = '(?i)(costco whse|costco wholesale)'
amount_max = 600
action = "EXPENSE"
category = 67
note = "Costco 门店采购按食品算（一次几百很正常）"

# Costco 线上（WWW COSTCO COM）刻意不设规则。
# 门店基本是食品采购，线上则是冰箱、轮胎、电子产品这类大件 ——
# 金额相近但归类完全不同，且描述里没有任何商品信息可供判断。
# 让闸门 1 每次拦下来问你一句，好过静默把一台冰箱记成买菜。

[[rule]]
name = "zelle-meal-share"
desc = '(?i)zelle payment to .*(austin|dinner|lunch|food)'
action = "EXPENSE"
category = 67
note = "聚餐分摊付出"

[[rule]]
name = "zelle-meal-reimbursement"
desc = '(?i)zelle payment from .*(food|dinner|lunch|meal)'
action = "EXPENSE"
category = 67
note = "他人还聚餐钱，作负向金额冲抵当月餐饮"

[[rule]]
name = "zelle-small-inbound-assumed-meal"
desc = '(?i)zelle payment from '
amount_max = 100
action = "EXPENSE"
category = 67
note = "小额个人还款默认按 AA 饭钱冲抵饮食。同额同日常成对出现（一人写备注一人不写）。非饭钱的小额还款会归错，在 review.csv 核对"

# ============================================================
# 四、日常交通  → 69 行/日常交通
# ============================================================

[[rule]]
name = "gas-station"
desc = '(?i)(chevron|shell oil|shell service|exxon|mobil|arco|valero|76 ?station|costco gas)'
action = "EXPENSE"
category = 69
note = "加油"

[[rule]]
name = "rideshare-transit"
desc = '(?i)(^uber(?! ?eats)|lyft|clipper|bart|caltrain|fastrak|parking|spothero)'
action = "EXPENSE"
category = 69
note = "打车/公交/停车过路费"

[[rule]]
name = "vehicle-registration"
desc = '(?i)(st of ca dmv|\bdmv\b)'
action = "EXPENSE"
category = 87
note = "车辆登记/牌照"

[[rule]]
name = "auto-insurance"
desc = '(?i)(mercury ins|geico|state farm|progressive ins|allstate)'
action = "EXPENSE"
category = 87
note = "车险"

[[rule]]
name = "life-insurance"
desc = '(?i)nationwide'
action = "EXPENSE"
category = 89
note = "人寿保险"

[[rule]]
name = "intl-flights"
desc = '(?i)(booking\.com|expedia|united airlines|delta air|american airlines|air china|cathay)'
action = "EXPENSE"
category = 92
note = "机票；若是国内旅游应改 88 旅游"

# ============================================================
# 五、娱乐订阅  → 72 娱乐/娱乐健身
# ============================================================

[[rule]]
name = "streaming-subscription"
desc = '(?i)(netflix|spotify|hulu|disney ?plus|hbo|max\.com|youtube ?premium|apple\.com/bill|audible)'
action = "EXPENSE"
category = 72
note = "流媒体订阅"

[[rule]]
name = "tennis"
desc = '(?i)(utr power|\butr\b|tennis|usta|racquet)'
action = "EXPENSE"
category = 72
note = "网球场地/评级"

[[rule]]
name = "gym"
desc = '(?i)(planet fitness|24 ?hour fit|equinox|lifetime fit|ymca|crunch fitness)'
action = "EXPENSE"
category = 72
note = "健身房"

# ============================================================
# 六、医疗 / 美容 / 经营
# ============================================================

[[rule]]
name = "medical"
desc = '(?i)(mental health|medical|clinic|dental|kaiser|sutter health|urgent care)'
action = "EXPENSE"
category = 97
note = "门诊"

[[rule]]
name = "salon"
desc = '(?i)(h-k hair|\bhair\b|salon|nail|\bspa\b)'
action = "EXPENSE"
category = 93
note = "美发美容"

[[rule]]
name = "ai-subscription"
desc = '(?i)(anthropic|openai|claude sub)'
action = "EXPENSE"
category = 95
note = "假设为经营开支（AI 课程相关）；若属个人使用应改 72"

[[rule]]
name = "atm-withdrawal"
desc = '(?i)atm.*(withdrwl|withdrawal)'
action = "EXPENSE"
category = 80
note = "取现后花在哪无法从账单得知"

# ============================================================
# 七、模糊商户 — 下面这些经常分错，review.csv 里重点核对
# ============================================================

[[rule]]
name = "amazon-assumed-household"
desc = '(?i)(amazon|amzn)(?!.*prime video)'
action = "EXPENSE"
category = 81
note = "假设为生活用品；数码产品应改 94，食品应改 67 — 需逐笔核对"

[[rule]]
name = "bigbox-assumed-household"
desc = '(?i)(target\b|walmart|wal-?mart|wm supercenter|bj.s wholesale)'
action = "EXPENSE"
category = 81
note = "假设为生活用品；若主要买食品应改 67 — 需核对"

[[rule]]
name = "pharmacy-assumed-household"
desc = '(?i)(cvs|walgreens|rite ?aid)'
action = "EXPENSE"
category = 81
note = "假设为生活用品；处方药应改 97 门诊"

# ============================================================
# 未匹配的交易会标成 UNKNOWN，出现在 review.csv 顶部。
# 逐条给它们加规则，命中率会逐月提高。
# 故意不设兜底规则 —— 静默归类比漏归类更危险。
# ============================================================

# ============================================================
# 八、PayPal / Venmo 平台内规则
#     这两家的描述来自备注或对方姓名，与银行的商户名不同
# ============================================================

[[rule]]
name = "venmo-tennis"
desc = '(?i)(tennis|球|比赛|华运|队长|court)'
source_is = "venmo"
action = "EXPENSE"
category = 72
note = "网球代付/还款，冲抵娱乐健身"

[[rule]]
name = "venmo-meal"
desc = '(?i)(hotpot|火锅|dinner|lunch|晚餐|午餐|饭|🍕|🍲|pizza|bbq|校长)'
source_is = "venmo"
action = "EXPENSE"
category = 67
note = "聚餐代付/还款，冲抵饮食"

[[rule]]
name = "venmo-small-assumed-meal"
source_is = "venmo"
amount_max = 100
action = "EXPENSE"
category = 67
note = "Venmo 小额默认按 AA 饭钱冲抵饮食；备注是自由文本，新写法会落这条，在 review.csv 核对"

[[rule]]
name = "paypal-small-assumed-meal"
source_is = "paypal"
amount_max = 100
action = "EXPENSE"
category = 67
note = "PayPal 小额个人往来默认按 AA 饭钱处理，同 Venmo"

[[rule]]
name = "square-small-merchant"
desc = '(?i)^(sq \*|uep\*|tst\*)'
amount_max = 60
action = "EXPENSE"
category = 67
note = "Square/UEP 小额收款，多为咖啡小吃；大额需核对"

[[rule]]
name = "apple-store-reimbursed"
desc = '(?i)apple\.com/us'
action = "IGNORE"
note = "公司报销，钱会回来，不是自己的开支。若某笔是自费购买，改 action = \"EXPENSE\" 并给 category（数码产品 94 / 子女 65）"

[[rule]]
name = "costco-online-large-assumed-appliance"
desc = '(?i)www ?costco ?com'
amount_min = 600
action = "EXPENSE"
category = 81
note = "线上大额假设为家电/家居耐用品（2026-08 是冰箱）。若某月是电子产品应改 94、轮胎改 87 —— 描述里没有商品信息，必须在 review.csv 逐笔核对"
