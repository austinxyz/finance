#
# 预期来源清单 —— 闸门 3 的输入。
#
# 每个月的目录里应该出现哪几家。缺任何一家即拒绝写入。
#
# 为什么需要这个文件：闸门 1（未分类）和闸门 2（充值缺口）都只能发现
# 数据里留下痕迹的问题。信用卡账单如果忘了导出，在任何一份 CSV 里都不留痕 ——
# 月度总额直接偏小，两道闸门全部放行。这份清单是唯一能发现它的机制。
#
# 字段:
#   id      必填，来源标识
#   parser  解析器 id（须已注册）。与 manual 二选一
#   manual  true 表示该来源无 CSV 导出，需手工补录。与 parser 二选一
#   label   显示名
#   note    备注
#
# 新增账户就在这里加一项。停用某个账户就删掉它 ——
# 留着会让每个月都误报缺失，久而久之你会开始无视闸门。
#

[[source]]
id = "chase_checking"
parser = "chase_checking"
label = "Chase 支票"

# 六家来源的解析器均已实现。
#
# 新增账户时：先加一项并标 pending = true（解析器还没写），
# 解析器落地后删掉该行 —— 加载器会强制要求，防止标记过期把可用来源挡在闸门外。

[[source]]
id = "chase_card"
parser = "chase_card"
label = "Chase 信用卡"
note = "真实消费主要在这里；checking 里的还款是 TRANSFER"

